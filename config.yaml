# Chess Tournament Simulator Configuration
# This file configures the behavior of the chess tournament simulator

# How often each board should make a move (in seconds)
move_interval_seconds: 10

# Number of parallel games/boards to simulate
number_of_boards: 4

# Maximum number of half-moves (plies) per game before forced draw
max_moves_per_game: 300

# Move strategy: random, threefold_preclaim, or pgn_file
move_strategy: "random"

# If true in threefold_preclaim mode, stop one ply before repetition claim
threefold_stop_preclaim: true

# Path to a PGN file to replay when move_strategy is pgn_file
pgn_source_path: "./pgn_input/5fold_rep.pgn"

# 1-based game index to replay from the PGN file
pgn_game_index: 1

# Optional per-board overrides.
# Fallback rule: any missing value on board N falls back to the resolved value from board N-1.
# Board 1 falls back to global defaults above.
board_configs:
  - board: 1
    move_strategy: "random"
  - board: 2
    move_strategy: "random"
    pgn_source_path: "./pgn_input/5fold_rep.pgn"
  - board: 3
    move_strategy: "random"
    pgn_source_path: "./pgn_input/3fold_rep.pgn"
  - board: 4
    move_strategy: "random"

# Directory where PGN files will be written
output_directory: "./pgn_output"

# Event name for PGN headers
event_name: "Test Live Tournament"

# Site name for PGN headers
site: "LiveChessCloud Simulator"

# Active tournament round exposed by the PGN server endpoints (round-{n})
round_number: 1

# Prefix for round/board identification in PGN headers
round_prefix: "Round 2 Board"

# If true, automatically start a new game when one finishes
auto_restart_games: false

# If true, maintain a tournament.pgn file with all finished games
use_single_tournament_file: true
