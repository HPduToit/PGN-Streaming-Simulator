# Chess Tournament Simulator Configuration
# This file configures the behavior of the chess tournament simulator

# Default move interval for boards without a per-board schedule (in seconds)
move_interval_seconds: 5

# Number of parallel games/boards to simulate
number_of_boards: 1

# Maximum number of half-moves (plies) per game before forced draw
max_moves_per_game: 300

# Move strategy: random, threefold_preclaim, or pgn_file
move_strategy: "random"

# If true in threefold_preclaim mode, stop one ply before repetition claim
threefold_stop_preclaim: true

# Global default PGN path used when a board resolves to move_strategy: pgn_file.
# This value is inherited by board 1 first, then by later boards through fallback
# unless explicitly overridden in board_configs.
pgn_source_path: "./pgn_input/5fold_rep.pgn"

# 1-based game index paired with pgn_source_path when using pgn_file strategy
# (same fallback behavior as pgn_source_path).
pgn_game_index: 1

# Optional per-board overrides.
# Fallback rule: any missing field on board N inherits from resolved board N-1.
# Board 1 inherits from global defaults above.
# move_interval_schedule is board-specific and does not inherit. Its moves values
# count half-moves/plies; omit moves on the final entry to apply it for the rest
# of the game.
# For any board that resolves to move_strategy: pgn_file, a non-empty pgn_source_path
# must resolve (either from that board override or inherited fallback/global default).
board_configs:
  - board: 1
    move_strategy: "pgn_file"
    pgn_source_path: "./pgn_input/U.S_Junior_B2_R7.pgn"
    move_interval_schedule:
      - moves: 86
        interval_seconds: 0.5
      - moves: 5
        interval_seconds: 5

# Directory where PGN files will be written
output_directory: "./pgn_output"

# Event name for PGN headers
event_name: "Test Live Tournament"

# Site name for PGN headers
site: "LiveChessCloud Simulator"

# Active tournament round exposed by the PGN server endpoints (round-{n})
round_number: 1

# Prefix for round/board identification in PGN headers
round_prefix: "Round 1 Board"

# If true, automatically start a new game when one finishes
auto_restart_games: false

# If true, maintain a tournament.pgn file with all finished games
use_single_tournament_file: true
