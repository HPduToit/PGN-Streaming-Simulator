[tool.poetry]
name = "pgncreationsimulator"
version = "0.1.0"
description = "A chess tournament simulator that plays random legal moves and continuously updates PGN files"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "pgncs", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
python-chess = "^1.999"
pyyaml = "^6.0"
fastapi = ">=0.128.0,<1.0.0"
uvicorn = {extras = ["standard"], version = ">=0.40.0,<1.0.0"}
pydantic = ">=2.12.5,<3.0.0"
pydantic-core = ">=2.41.5,<3.0.0"
watchfiles = ">=1.1.1,<2.0.0"
watchdog = "^3.0.0"
psycopg = {extras = ["binary"], version = ">=3.2.12,<4.0.0"}

[tool.poetry.scripts]
pgncreationsimulator = "pgncs.main:main"
pgn-tournament = "pgncs.main:main"
pgn-server = "pgncs.pgn_server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
