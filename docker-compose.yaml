services:
  pgn_db:
    container_name: "pgn_db"
    image: postgres:16
    environment:
      POSTGRES_DB: "${PGNSS_POSTGRES_DB:-pgn_simulator}"
      POSTGRES_USER: "${PGNSS_POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${PGNSS_POSTGRES_PASSWORD:-postgres}"
    ports:
      - "${PGNSS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGNSS_POSTGRES_USER:-postgres} -d ${PGNSS_POSTGRES_DB:-pgn_simulator}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    cpus: 0.5

volumes:
  pgn_postgres_data:
